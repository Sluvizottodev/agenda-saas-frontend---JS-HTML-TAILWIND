<div class="form-login-component bg-white p-6 rounded-lg shadow-lg">
  <h1 class="text-2xl font-semibold mb-4">Entrar na sua conta</h1>

  <p class="text-sm text-gray-600 mb-4">Acesse sua agenda e gerencie seus atendimentos.</p>

  <div id="loginFeedback" role="status" aria-live="polite" class="mb-3"></div>

  <form id="formLogin" class="form-login space-y-4" novalidate>
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
      <input autofocus type="email" id="email" name="email" required placeholder="seu@exemplo.com"
        class="mt-1 block w-full rounded-md border border-gray-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-300" />
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-gray-700">Senha</label>
      <input type="password" id="password" name="password" required minlength="6" placeholder="••••••••"
        class="mt-1 block w-full rounded-md border border-gray-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-300" />
    </div>

    <div class="flex items-center justify-between">
      <label class="flex items-center text-sm text-gray-600">
        <input type="checkbox" id="remember" name="remember" class="mr-2 h-4 w-4 text-blue-600" /> Lembrar
      </label>
  <a href="register.html" class="text-sm text-blue-600">Criar conta</a>
    </div>

    <div>
      <button id="btnLogin" type="submit" class="w-full px-4 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded-md">Entrar</button>
    </div>
  </form>

  
</div>

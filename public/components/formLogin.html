<form id="formLogin" class="space-y-4">
  <div id="loginFeedback" class="mb-4"></div>
  
  <div>
    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
    <input type="email" id="email" name="email" required autofocus placeholder="seu@email.com" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
  </div>
  
  <div>
    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
    <input type="password" id="password" name="password" required minlength="6" placeholder="Mínimo 6 caracteres" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
  </div>
  
  <button type="submit" id="btnLogin" class="w-full py-2 bg-blue-600 text-white rounded font-medium hover:bg-blue-700">Entrar</button>
  
  <div class="text-center pt-2">
    <button type="button" id="btnCriarConta" class="text-sm text-blue-600 hover:underline">Não tem conta? Criar agora</button>
  </div>
</form>

<div class="bg-white p-4 rounded shadow" id="register-form-root">
  <h3 class="text-lg font-semibold mb-3">Registrar usuário</h3>
  <form id="formRegister" class="space-y-3">
    <div>
      <label class="block text-sm font-medium text-gray-700">Nome</label>
      <input name="name" type="text" required class="mt-1 block w-full rounded border-gray-300 px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">Email</label>
      <input name="email" type="email" required class="mt-1 block w-full rounded border-gray-300 px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">Senha</label>
      <input name="password" type="password" required minlength="6" class="mt-1 block w-full rounded border-gray-300 px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">Role</label>
      <select name="role" class="mt-1 block w-full rounded border-gray-300 px-3 py-2">
        <option value="cliente">cliente</option>
        <option value="prestador">prestador</option>
      </select>
    </div>
    <div>
      <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded">Criar usuário</button>
    </div>
  </form>
</div>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Serviços e Horários</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body class="bg-gray-50">
    <header data-component="header"></header>

    <main class="max-w-7xl mx-auto px-4 py-8 mb-20">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Meus Serviços e Horários</h1>
            <p class="text-gray-600 mt-2">Gerencie seus serviços e configure seus horários disponíveis</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <button id="btn-novo-servico" class="bg-green-600 hover:bg-green-700 text-white px-6 py-4 rounded-lg font-semibold transition flex items-center justify-center">
                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                </svg>
                Adicionar Novo Serviço
            </button>
            <button id="btn-gerenciar-horarios" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-4 rounded-lg font-semibold transition flex items-center justify-center">
                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                Gerenciar Horários
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6">
                <div class="text-gray-600 text-sm font-medium">Serviços Cadastrados</div>
                <div class="text-3xl font-bold text-green-600 mt-2" id="stat-servicos">0</div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="text-gray-600 text-sm font-medium">Receita Potencial</div>
                <div class="text-3xl font-bold text-blue-600 mt-2" id="stat-receita">R$ 0,00</div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="text-gray-600 text-sm font-medium">Slots Disponíveis</div>
                <div class="text-3xl font-bold text-purple-600 mt-2" id="stat-slots">0</div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow">
            <div class="border-b p-6">
                <h2 class="text-xl font-semibold text-gray-900">Seus Serviços</h2>
            </div>
            <div id="lista-servicos" class="p-6">
                <p class="text-gray-500 text-center py-8">Nenhum serviço cadastrado ainda.</p>
            </div>
        </div>
    </main>

    <footer data-component="footer"></footer>

    <!-- Modal: Novo Serviço -->
    <div id="modal-servico" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-lg max-w-md w-full p-6">
            <h2 class="text-xl font-bold mb-4">Novo Serviço</h2>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Nome do Serviço</label>
                <input type="text" id="servico-nome" class="w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="Ex: Corte de cabelo">
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Descrição</label>
                <textarea id="servico-descricao" class="w-full px-3 py-2 border border-gray-300 rounded-lg" rows="3" placeholder="Descreva o serviço"></textarea>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Preço (R$)</label>
                <input type="number" id="servico-preco" class="w-full px-3 py-2 border border-gray-300 rounded-lg" step="0.01" min="0" placeholder="0,00">
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Duração (minutos)</label>
                <input type="number" id="servico-duracao" class="w-full px-3 py-2 border border-gray-300 rounded-lg" min="15" step="15" value="60" placeholder="60">
            </div>

            <div class="flex space-x-3">
                <button id="modal-servico-cancelar" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-900 px-4 py-2 rounded-lg font-semibold">
                    Cancelar
                </button>
                <button id="modal-servico-confirmar" class="flex-1 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-semibold">
                    Criar Serviço
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Gerenciar Horários -->
    <div id="modal-horarios" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-lg max-w-2xl w-full p-6">
            <h2 class="text-xl font-bold mb-4">Gerenciar Horários</h2>
            
            <div class="grid grid-cols-7 gap-2 mb-4">
                <div class="text-center font-semibold text-gray-700">Dom</div>
                <div class="text-center font-semibold text-gray-700">Seg</div>
                <div class="text-center font-semibold text-gray-700">Ter</div>
                <div class="text-center font-semibold text-gray-700">Qua</div>
                <div class="text-center font-semibold text-gray-700">Qui</div>
                <div class="text-center font-semibold text-gray-700">Sex</div>
                <div class="text-center font-semibold text-gray-700">Sab</div>
            </div>

            <div class="space-y-4 mb-4">
                <div id="horarios-container" class="space-y-3">
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Horário de Início</label>
                <input type="time" id="horario-inicio" class="w-full px-3 py-2 border border-gray-300 rounded-lg" value="08:00">
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Horário de Fim</label>
                <input type="time" id="horario-fim" class="w-full px-3 py-2 border border-gray-300 rounded-lg" value="18:00">
            </div>

            <div class="flex space-x-3">
                <button id="modal-horarios-cancelar" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-900 px-4 py-2 rounded-lg font-semibold">
                    Cancelar
                </button>
                <button id="modal-horarios-confirmar" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold">
                    Salvar Horários
                </button>
            </div>
        </div>
    </div>

    <script type="module">
    import { loadComponents } from '../js/components-loader.js';
    import { requireRole } from '../js/utils/auth.js';

    document.addEventListener('DOMContentLoaded', async () => {
        if (!requireRole('PRESTADOR')) return;
        
        await loadComponents();
        initAgendaPrestador();
    });

    function initAgendaPrestador() {
        setupBotoes();
        carregarServicos();
    }

    function setupBotoes() {
        document.getElementById('btn-novo-servico').addEventListener('click', () => {
            document.getElementById('modal-servico').classList.remove('hidden');
        });

        document.getElementById('btn-gerenciar-horarios').addEventListener('click', () => {
            document.getElementById('modal-horarios').classList.remove('hidden');
        });

        document.getElementById('modal-servico-cancelar').addEventListener('click', () => {
            document.getElementById('modal-servico').classList.add('hidden');
            limparFormServico();
        });

        document.getElementById('modal-horarios-cancelar').addEventListener('click', () => {
            document.getElementById('modal-horarios').classList.add('hidden');
        });

        document.getElementById('modal-servico-confirmar').addEventListener('click', criarServico);
        document.getElementById('modal-horarios-confirmar').addEventListener('click', salvarHorarios);
    }

    async function carregarServicos() {
        try {
            const response = await fetch('/api/servicos', {
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('auth_token') }
            });
            
            if (response.ok) {
                const servicos = await response.json() || [];
                document.getElementById('stat-servicos').textContent = servicos.length;
                
                const receita = servicos.reduce((acc, s) => acc + (s.preco || 0), 0);
                document.getElementById('stat-receita').textContent = 'R$ ' + receita.toFixed(2);
                
                renderServicos(servicos);
            }
        } catch (error) {
            console.error('Erro ao carregar serviços:', error);
        }
    }

    function renderServicos(servicos) {
        const container = document.getElementById('lista-servicos');
        
        if (!servicos || servicos.length === 0) {
            container.innerHTML = '<p class="text-gray-500 text-center py-8">Nenhum serviço cadastrado ainda. <a href="#" class="text-blue-600">Criar primeiro</a></p>';
            return;
        }

        container.innerHTML = servicos.map(servico => `
            <div class="border rounded-lg p-4 mb-4 hover:bg-gray-50 transition">
                <div class="flex items-start justify-between">
                    <div class="flex-1">
                        <h3 class="font-semibold text-gray-900">${servico.nome}</h3>
                        <p class="text-sm text-gray-600 mt-1">${servico.descricao || 'Sem descrição'}</p>
                        <div class="mt-2 flex items-center space-x-4">
                            <span class="text-lg font-bold text-green-600">R$ ${servico.preco?.toFixed(2) || '0,00'}</span>
                            <span class="text-xs text-gray-500">${servico.duracao || 60} min</span>
                            <span class="text-xs ${servico.ativo ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'} px-2 py-1 rounded">
                                ${servico.ativo ? 'Ativo' : 'Inativo'}
                            </span>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <button class="btn-editar w-20 bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-sm" data-servico-id="${servico.id}">
                            Editar
                        </button>
                        <button class="btn-deletar w-20 bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm" data-servico-id="${servico.id}">
                            Deletar
                        </button>
                    </div>
                </div>
            </div>
        `).join('');

        // Attach event listeners
        document.querySelectorAll('.btn-deletar').forEach(btn => {
            btn.addEventListener('click', (e) => deletarServico(e.target.dataset.servicoId));
        });
    }

    function limparFormServico() {
        document.getElementById('servico-nome').value = '';
        document.getElementById('servico-descricao').value = '';
        document.getElementById('servico-preco').value = '';
        document.getElementById('servico-duracao').value = '60';
    }

    async function criarServico() {
        const nome = document.getElementById('servico-nome').value;
        const descricao = document.getElementById('servico-descricao').value;
        const preco = parseFloat(document.getElementById('servico-preco').value);
        const duracao = parseInt(document.getElementById('servico-duracao').value);

        if (!nome || !preco) {
            alert('Preencha os campos obrigatórios');
            return;
        }

        try {
            const response = await fetch('/api/servicos', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('auth_token'),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ nome, descricao, preco, duracao })
            });

            if (response.ok) {
                alert('Serviço criado com sucesso!');
                document.getElementById('modal-servico').classList.add('hidden');
                limparFormServico();
                await carregarServicos();
            }
        } catch (error) {
            console.error('Erro ao criar serviço:', error);
            alert('Erro ao criar serviço');
        }
    }

    async function deletarServico(servicoId) {
        if (!confirm('Tem certeza que deseja deletar este serviço?')) return;

        try {
            const response = await fetch(`/api/servicos/${servicoId}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('auth_token') }
            });

            if (response.ok) {
                alert('Serviço deletado com sucesso!');
                await carregarServicos();
            }
        } catch (error) {
            console.error('Erro ao deletar serviço:', error);
            alert('Erro ao deletar serviço');
        }
    }

    function salvarHorarios() {
        const inicio = document.getElementById('horario-inicio').value;
        const fim = document.getElementById('horario-fim').value;
        
        console.log('Horários salvos:', { inicio, fim });
        alert('Horários salvos com sucesso!');
        document.getElementById('modal-horarios').classList.add('hidden');
    }
    </script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard — Cliente</title>
    <link rel="stylesheet" href="../styles/style.css">
  </head>
  <body class="bg-gray-50 font-sans min-h-screen text-gray-800">
    <header data-component="header"></header>

    <main class="max-w-7xl mx-auto px-4 py-8 mb-20">
      <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900">Meus Agendamentos</h1>
        <p class="text-gray-600 mt-2">Gerencie seus agendamentos com prestadores de serviço</p>
      </div>

      <div class="mb-6">
        <a href="/pages/agendar-servico.html" class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold transition">
          + Novo Agendamento
        </a>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white rounded-lg shadow p-6">
          <div class="text-gray-600 text-sm font-medium">Próximos Agendamentos</div>
          <div class="text-3xl font-bold text-blue-600 mt-2" id="stat-proximos">0</div>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
          <div class="text-gray-600 text-sm font-medium">Histórico</div>
          <div class="text-3xl font-bold text-green-600 mt-2" id="stat-historico">0</div>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
          <div class="text-gray-600 text-sm font-medium">Prestadores Favoritos</div>
          <div class="text-3xl font-bold text-purple-600 mt-2" id="stat-favoritos">0</div>
        </div>
      </div>

      <div class="bg-white rounded-lg shadow">
        <div class="border-b p-6">
          <h2 class="text-xl font-semibold text-gray-900">Seus Agendamentos</h2>
        </div>
        <div id="lista-agendamentos" class="p-6">
          <p class="text-gray-500 text-center">Nenhum agendamento ainda.</p>
        </div>
      </div>
    </main>

    <footer data-component="footer"></footer>

  <script type="module">
  import { loadComponents } from '../js/components-loader.js';
  import { requireRole, getRole } from '../js/utils/auth.js';
  
  document.addEventListener('DOMContentLoaded', async () => {
    if (!requireRole('CLIENTE')) return;
    
    await loadComponents();
    initClientDashboard();
  });

  function initClientDashboard() {
    loadAgendamentos();
  }

  async function loadAgendamentos() {
    try {
      const response = await fetch('/api/agendamentos', {
        headers: {
          'Authorization': 'Bearer ' + localStorage.getItem('auth_token')
        }
      });
      
      if (response.ok) {
        const agendamentos = await response.json();
        renderAgendamentos(agendamentos || []);
      }
    } catch (error) {
      console.error('Erro ao carregar agendamentos:', error);
    }
  }

  function renderAgendamentos(agendamentos) {
    const container = document.getElementById('lista-agendamentos');
    
    if (!agendamentos || agendamentos.length === 0) {
      container.innerHTML = '<p class="text-gray-500 text-center py-8">Nenhum agendamento ainda.</p>';
      return;
    }

    const proximosCount = agendamentos.filter(a => new Date(a.data) > new Date()).length;
    const historicoCount = agendamentos.length - proximosCount;
    
    document.getElementById('stat-proximos').textContent = proximosCount;
    document.getElementById('stat-historico').textContent = historicoCount;

    container.innerHTML = agendamentos.map(agendamento => `
      <div class="border rounded-lg p-4 mb-4 hover:bg-gray-50 transition">
        <div class="flex items-center justify-between">
          <div>
            <p class="font-semibold text-gray-900">${agendamento.servico?.nome || 'Serviço'}</p>
            <p class="text-sm text-gray-600">${agendamento.prestador?.nome || 'Prestador'}</p>
            <p class="text-sm text-blue-600 mt-1">${new Date(agendamento.data).toLocaleDateString('pt-BR')} às ${agendamento.hora || '--:--'}</p>
          </div>
          <span class="text-xs font-medium px-3 py-1 rounded-full ${agendamento.status === 'CONFIRMADO' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">
            ${agendamento.status || 'Pendente'}
          </span>
        </div>
      </div>
    `).join('');
  }
  </script>
  </body>
</html>

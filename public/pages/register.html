<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - AgendaSaaS</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body class="bg-gray-50 font-sans min-h-screen text-gray-800">
    <main class="min-h-screen flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-2xl">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-900">AgendaSaaS</h1>
                <p class="text-gray-600 mt-2">Crie sua conta para começar</p>
            </div>
            
            <form id="formRegister" class="space-y-4 bg-white p-6 rounded shadow-lg">
                <div id="registerFeedback" class="mb-4"></div>
                
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
                    <input type="text" id="name" name="name" required autofocus placeholder="Seu nome completo" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-green-500" />
                </div>
                
                <div>
                    <label for="reg-email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="reg-email" name="email" required placeholder="seu@email.com" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-green-500" />
                </div>
                
                <div>
                    <label for="reg-password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <input type="password" id="reg-password" name="password" required minlength="6" placeholder="Mínimo 6 caracteres" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-green-500" />
                </div>
                
                <div>
                    <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1">Confirmar Senha</label>
                    <input type="password" id="confirm-password" name="confirmPassword" required placeholder="Digite a senha novamente" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-green-500" />
                </div>
                
                    <div id="cpf-field" class="hidden">
                        <label for="cpf" class="block text-sm font-medium text-gray-700 mb-1">CPF</label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-green-500" />
                    </div>
                
                    <div id="cnpj-field" class="hidden">
                        <label for="cnpj" class="block text-sm font-medium text-gray-700 mb-1">CNPJ</label>
                        <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0001-00" maxlength="18" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-green-500" />
                    </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Tipo de Conta</label>
                    <div class="flex gap-4">
                        <label class="flex items-center">
                            <input type="radio" name="role" value="CLIENTE" checked class="mr-2" /> Cliente
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="role" value="PRESTADOR" class="mr-2" /> Prestador
                        </label>
                    </div>
                </div>
                
                <button type="submit" id="reg-submit" class="w-full py-2 bg-green-600 text-white rounded font-medium hover:bg-green-700">Criar Conta</button>
                
                <div class="text-center pt-2">
                    <button type="button" id="btnFazerLogin" class="text-sm text-blue-600 hover:underline">Já tem conta? Entrar</button>
                </div>
            </form>
        </div>
    </main>

    <script type="module">
        import { loadComponents } from '../js/components-loader.js';
        import { required, isEmail, minLength, confirm } from '../js/utils/validators/index.js';
        import router from '../js/utils/router.js';
        import toast from '../js/utils/toast.js';
        import authManager from '../js/utils/auth.js';

        document.addEventListener('DOMContentLoaded', async () => {
            await loadComponents().catch((err) => {
                console.error('Erro ao carregar componentes:', err);
            });
            
            await new Promise(resolve => setTimeout(resolve, 100));

            // Botão Fazer Login
            const btnFazerLogin = document.getElementById('btnFazerLogin');
            if (btnFazerLogin) {
                btnFazerLogin.addEventListener('click', (e) => {
                    e.preventDefault();
                    router.navigateTo('/pages/login.html', true);
                });
            } else {
                console.warn('Botão "Fazer Login" não encontrado');
            }

                const radioCliente = document.querySelector('input[name="role"][value="CLIENTE"]');
                const radioPrestador = document.querySelector('input[name="role"][value="PRESTADOR"]');
                const cpfField = document.getElementById('cpf-field');
                const cnpjField = document.getElementById('cnpj-field');
                const cpfInput = document.getElementById('cpf');
                const cnpjInput = document.getElementById('cnpj');
            
                function updateFields() {
                    const isCliente = radioCliente?.checked;
                    if (isCliente) {
                        cpfField?.classList.remove('hidden');
                        cnpjField?.classList.add('hidden');
                        cpfInput.required = true;
                        cnpjInput.required = false;
                    } else {
                        cpfField?.classList.add('hidden');
                        cnpjField?.classList.remove('hidden');
                        cpfInput.required = false;
                        cnpjInput.required = true;
                    }
                }
            
                radioCliente?.addEventListener('change', updateFields);
                radioPrestador?.addEventListener('change', updateFields);
                updateFields(); 

            // Form de Registro
            const form = document.getElementById('formRegister');
            if (!form) {
                console.error('Formulário de registro não encontrado');
                return;
            }

            const submitBtn = document.getElementById('reg-submit');
            const passInput = document.getElementById('reg-password');
            const togglePassBtn = document.getElementById('toggle-pass');
            const passStrengthBar = document.getElementById('pass-strength-bar');

            if (togglePassBtn) {
                togglePassBtn.addEventListener('click', () => {
                    const isPassword = passInput.type === 'password';
                    passInput.type = isPassword ? 'text' : 'password';
                    togglePassBtn.textContent = isPassword ? 'Ocultar' : 'Mostrar';
                });
            }
            if (passInput) {
                passInput.addEventListener('input', () => {
                    const value = passInput.value;
                    let strength = 0;
                    if (value.length >= 6) strength = 1;
                    if (value.length >= 8 && /[a-z]/.test(value) && /[A-Z]/.test(value)) strength = 2;
                    if (strength > 0 && /[0-9]/.test(value) && /[^a-zA-Z0-9]/.test(value)) strength = 3;

                    const colors = ['bg-red-400', 'bg-yellow-400', 'bg-green-400'];
                    const widths = ['w-1/3', 'w-2/3', 'w-full'];
                    
                    if (passStrengthBar) {
                        passStrengthBar.className = `h-full transition-width ${colors[strength] || 'bg-red-400'} ${widths[strength] || 'w-0'}`;
                    }
                });
            }
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const data = new FormData(form);
                const name = (data.get('name') || '').toString().trim();
                const email = (data.get('email') || '').toString().trim();
                const password = (data.get('password') || '').toString();
                const confirmPassword = (data.get('confirmPassword') || '').toString();
                    const role = (data.get('role') || 'CLIENTE').toString();
                    const cpf = (data.get('cpf') || '').toString().trim();
                    const cnpj = (data.get('cnpj') || '').toString().trim();

                // Validações
                const errors = {};

                const vName = required(name);
                if (!vName.valid) {
                    errors.name = vName.message;
                    toast.warning(vName.message);
                }

                const vEmail = required(email);
                if (!vEmail.valid) {
                    errors.email = vEmail.message;
                    toast.warning(vEmail.message);
                } else {
                    const vEmailFormat = isEmail(email);
                    if (!vEmailFormat.valid) {
                        errors.email = vEmailFormat.message;
                        toast.warning(vEmailFormat.message);
                    }
                }

                const vPass = required(password);
                if (!vPass.valid) {
                    errors.password = vPass.message;
                    toast.warning(vPass.message);
                } else {
                    const vPassLen = minLength(password, 6);
                    if (!vPassLen.valid) {
                        errors.password = vPassLen.message;
                        toast.warning(vPassLen.message);
                    }
                }

                const vConfirm = required(confirmPassword);
                if (!vConfirm.valid) {
                    errors.confirmPassword = vConfirm.message;
                    toast.warning(vConfirm.message);
                } else {
                    const vConfirmMatch = confirm(password, confirmPassword);
                    if (!vConfirmMatch.valid) {
                        errors.confirmPassword = vConfirmMatch.message;
                        toast.warning(vConfirmMatch.message);
                    }
                }

                    // Validar CPF para Cliente ou CNPJ para Prestador
                    if (role.toUpperCase() === 'CLIENTE') {
                        const vCpf = required(cpf);
                        if (!vCpf.valid) {
                            errors.cpf = 'CPF é obrigatório';
                            toast.warning('CPF é obrigatório');
                        } else {
                            const cpfLimpo = cpf.replace(/\D/g, '');
                            if (cpfLimpo.length !== 11) {
                                errors.cpf = 'CPF deve ter 11 dígitos';
                                toast.warning('CPF deve ter 11 dígitos');
                            }
                        }
                    } else if (role.toUpperCase() === 'PRESTADOR') {
                        const vCnpj = required(cnpj);
                        if (!vCnpj.valid) {
                            errors.cnpj = 'CNPJ é obrigatório';
                            toast.warning('CNPJ é obrigatório');
                        } else {
                            const cnpjLimpo = cnpj.replace(/\D/g, '');
                            if (cnpjLimpo.length !== 14) {
                                errors.cnpj = 'CNPJ deve ter 14 dígitos';
                                toast.warning('CNPJ deve ter 14 dígitos');
                            }
                        }
                    }

                // erros
                const errName = document.getElementById('err-name');
                const errEmail = document.getElementById('err-email');
                const errPassword = document.getElementById('err-password');
                const errConfirm = document.getElementById('err-confirm');

                if (errName) errName.textContent = errors.name || '';
                if (errEmail) errEmail.textContent = errors.email || '';
                if (errPassword) errPassword.textContent = errors.password || '';
                if (errConfirm) errConfirm.textContent = errors.confirmPassword || '';

                if (Object.keys(errors).length > 0) return;

                if (submitBtn) submitBtn.disabled = true;
                const submitText = document.getElementById('reg-submit-text');
                const original = submitText ? submitText.textContent : 'Criar conta';
                if (submitText) submitText.textContent = 'Criando conta...';

                try {
                    const endpoint = role.toUpperCase() === 'PRESTADOR' 
                        ? 'http://localhost:8080/api/auth/register/prestador'
                        : 'http://localhost:8080/api/auth/register/cliente';
                    
                        // Montar o payload com os campos específicos
                        const requestBody = { nome: name, email, senha: password };
                    
                        if (role.toUpperCase() === 'CLIENTE') {
                            requestBody.cpf = cpf.replace(/\D/g, '');
                        } else {
                            requestBody.cnpj = cnpj.replace(/\D/g, '');
                            requestBody.especializacao = 'Serviços gerais';
                        }
                    
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(requestBody)
                    });

                    if (response.ok) {
                        toast.success('Conta criada com sucesso! Redirecionando para login...');
                        setTimeout(() => router.navigateTo('login', true), 1500);
                    } else {
                        const error = await response.json();
                        toast.error(error.message || 'Erro ao criar conta');
                    }
                } catch (err) {
                    console.error('Erro:', err);
                    toast.error('Erro de conexão ao criar conta. Tente novamente.');
                } finally {
                    if (submitBtn) submitBtn.disabled = false;
                    if (submitText) submitText.textContent = original;
                }
            });
        });
    </script>
</body>
</html>

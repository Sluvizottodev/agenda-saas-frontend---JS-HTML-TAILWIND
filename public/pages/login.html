<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgendaSaaS</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body class="bg-gray-50 font-sans min-h-screen text-gray-800">

    <main class="min-h-screen flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-900">AgendaSaaS</h1>
                <p class="text-gray-600 mt-2">Faça login para acessar sua agenda</p>
            </div>
            
            <form id="formLogin" class="space-y-4 bg-white p-6 rounded shadow-lg">
                <div id="loginFeedback" class="mb-4"></div>
                
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" name="email" required autofocus placeholder="seu@email.com" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <input type="password" id="password" name="password" required minlength="6" placeholder="Mínimo 6 caracteres" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                
                <button type="submit" id="btnLogin" class="w-full py-2 bg-blue-600 text-white rounded font-medium hover:bg-blue-700">Entrar</button>
                
                <div class="text-center pt-2">
                    <button type="button" id="btnCriarConta" class="text-sm text-blue-600 hover:underline">Não tem conta? Criar agora</button>
                </div>
            </form>
        </div>
    </main>

    <script type="module">
    import { loadComponents } from '../js/components-loader.js';
    import { required, isEmail } from '../js/utils/validators/index.js';
    import authManager from '../js/utils/auth.js';
    import router from '../js/utils/router.js';
    import toast from '../js/utils/toast.js';
        
    document.addEventListener('DOMContentLoaded', async () => {
        await loadComponents().catch((err) => {
            console.error('Erro ao carregar componentes:', err);
        });

        await new Promise(resolve => setTimeout(resolve, 100));

        const form = document.getElementById('formLogin');
        const feedback = document.getElementById('loginFeedback');
        const btn = document.getElementById('btnLogin');
        const btnCriarConta = document.getElementById('btnCriarConta');

        // Botão Criar Conta
        if (btnCriarConta) {
            btnCriarConta.addEventListener('click', (e) => {
                e.preventDefault();
                router.navigateTo('/pages/register.html', true);
            });
        } else {
            console.warn('Botão "Criar Conta" não encontrado');
        }

        if (!form) {
            console.error('Formulário de login não encontrado');
            return;
        }

        function showFeedback(message, kind){
            if (kind === 'error') {
                toast.error(message);
            } else if (kind === 'success') {
                toast.success(message);
            } else if (kind === 'warning') {
                toast.warning(message);
            } else {
                toast.info(message);
            }
            
            if(feedback){
                feedback.textContent = message;
                feedback.className = kind === 'error' ? 'text-sm text-red-600 mb-4' : 'text-sm text-green-600 mb-4';
            }
        }

        form.addEventListener('submit', async function(ev){
            ev.preventDefault();
            var data = new FormData(form);
            var email = (data.get('email')||'').toString().trim();
            var password = (data.get('password')||'').toString();

            // validate
            const vEmailReq = required(email);
            if (!vEmailReq.valid) { showFeedback(vEmailReq.message, 'error'); return; }
            const vEmail = isEmail(email);
            if (!vEmail.valid) { showFeedback(vEmail.message, 'error'); return; }
            const vPass = required(password);
            if (!vPass.valid) { showFeedback(vPass.message, 'error'); return; }

            btn.disabled = true; 
            const original = btn.textContent; 
            btn.textContent = 'Entrando...';
            
            try{
                try {
                    const credentials = { email: email, password: password };
                    await authManager.login(credentials);
                    showFeedback('Login efetuado com sucesso!', 'success');
                    setTimeout(() => authManager.redirectToDashboard(), 500);
                    return;
                } catch (apiError) {
                    console.warn('Login via API falhou, usando simulação:', apiError);
                }

                const mockUser = { id: 'temp-1', nome: 'Usuário Temp', email: email, tipo: 'CLIENTE' }; 
                localStorage.setItem('user_data', JSON.stringify(mockUser)); 
                localStorage.setItem('auth_token', 'temp-token-' + Date.now());
                localStorage.setItem('user_role', 'CLIENTE');
                
                showFeedback('Acesso temporário concedido. Redirecionando...', 'success');
                setTimeout(() => router.navigateTo('dashboardCliente', true), 1000);
            }catch(err){ 
                console.error(err); 
                showFeedback(err.message || 'Falha ao autenticar', 'error'); 
            }
            finally{ 
                btn.disabled = false; 
                btn.textContent = original; 
            }
        });
    });
    </script>
</body>
</html>

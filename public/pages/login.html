<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body class="bg-gray-50 font-sans min-h-screen text-gray-800">

    <main class="min-h-[70vh] flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md">
            <div data-component="formLogin"></div>
        </div>
    </main>


    <script type="module">
    import { loadComponents } from '../js/components-loader.js';
    import { required, isEmail } from '../js/utils/validators/index.js';
    import authManager from '../js/utils/auth.js';
    import router from '../js/utils/router.js';
        
        document.addEventListener('DOMContentLoaded', async () => {
            await loadComponents().catch(() => {});

            const form = document.getElementById('formLogin');
            const feedback = document.getElementById('loginFeedback');
            const btn = document.getElementById('btnLogin');

            function showFeedback(message, kind){
                try{ 
                    globalThis.dispatchEvent(new CustomEvent('app:toast', { detail: { message: message, kind: kind } })); 
                }catch(e){
                    console.warn('Toast not available:', e);
                }
                if(feedback){
                    feedback.textContent = message;
                    feedback.className = kind === 'error' ? 'text-sm text-red-600' : 'text-sm text-green-600';
                }
            }

            if (!form) return;

            form.addEventListener('submit', async function(ev){
                ev.preventDefault();
                var data = new FormData(form);
                var email = (data.get('email')||'').toString().trim();
                var password = (data.get('password')||'').toString();

                // validate
                const vEmailReq = required(email);
                if (!vEmailReq.valid) { showFeedback(vEmailReq.message, 'error'); return; }
                const vEmail = isEmail(email);
                if (!vEmail.valid) { showFeedback(vEmail.message, 'error'); return; }
                const vPass = required(password);
                if (!vPass.valid) { showFeedback(vPass.message, 'error'); return; }

                btn.disabled = true; const original = btn.textContent; btn.textContent = 'Entrando...';
                try{
                    // Tentar fazer login real com a API
                    try {
                        const credentials = { email: email, password: password };
                        await authManager.login(credentials);
                        showFeedback('Login efetuado com sucesso!', 'success');
                        // Usar o redirecionamento do authManager
                        setTimeout(() => authManager.redirectToDashboard(), 500);
                        return;
                    } catch (apiError) {
                        console.warn('Login via API falhou, usando simulação:', apiError);
                    }

                    const mockUser = { id: 'temp-1', nome: 'Usuário Temp', email: email, tipo: 'CLIENTE' }; 
                    localStorage.setItem('user_data', JSON.stringify(mockUser)); 
                    localStorage.setItem('auth_token', 'temp-token-' + Date.now());
                    
                    showFeedback('Acesso temporário concedido. Redirecionando...', 'success');
                    setTimeout(() => router.navigateTo('dashboardCliente', true), 1000);
                }catch(err){ 
                    console.error(err); 
                    showFeedback(err.message || 'Falha ao autenticar', 'error'); 
                }
                finally{ btn.disabled = false; btn.textContent = original; }
            });
        });
    </script>
</body>
</html>

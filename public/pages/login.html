<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
                <link rel="stylesheet" href="/styles/tailwind.css">
                <style>body{padding:1rem}</style>
</head>
<body>
        
        <main class="min-h-[70vh] flex items-center justify-center px-4">
                <div class="w-full max-w-md">
                        <div data-component="formLogin"></div>
                </div>
        </main>

        
    <script type="module" src="../js/components-loader.js"></script>

            <script type="module">
                import { loadComponents } from '../js/components-loader.js';
                document.addEventListener('DOMContentLoaded', async () => {
                    await loadComponents().catch(() => {});

                    const form = document.getElementById('formLogin');
                    const feedback = document.getElementById('loginFeedback');
                    const btn = document.getElementById('btnLogin');

                    function showFeedback(message, kind){
                        try{ globalThis.dispatchEvent(new CustomEvent('app:toast', { detail: { message: message, kind: kind } })); }catch(e){}
                        if(feedback){
                            feedback.textContent = message;
                            feedback.className = kind === 'error' ? 'text-sm text-red-600' : 'text-sm text-green-600';
                        }
                    }

                    if (!form) return;

                    form.addEventListener('submit', async function(ev){
                        ev.preventDefault();
                        var data = new FormData(form);
                        var email = (data.get('email')||'').toString().trim();
                        var password = (data.get('password')||'').toString();

                        if(!email || !password){ showFeedback('Preencha email e senha.', 'error'); return; }

                        btn.disabled = true; const original = btn.textContent; btn.textContent = 'Entrando...';
                        try{
                            var base = globalThis.API_BASE || globalThis.__API_BASE__ || '';
                            function resolve(p){ const path=location.pathname||''; const inPages=path.includes('/pages/')||path.includes('/src/pages/'); return inPages? p : '/src/pages/'+p; }
                            if(base){
                                var res = await fetch((base.endsWith('/')?base.slice(0,-1):base) + '/auth/login', {
                                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ email: email, password: password }),
                                });
                                if(!res.ok) throw new Error('Credenciais inválidas');
                                showFeedback('Entrando...', 'success');
                                globalThis.location.replace(resolve('agenda.html'));
                                return;
                            }

                            await new Promise(r=>setTimeout(r,700));
                            try { var mock = { id: 'local-1', name: 'Usuário Teste', email: email, role: 'cliente' }; localStorage.setItem('user', JSON.stringify(mock)); } catch(e){}
                            showFeedback('Login efetuado (simulado). Redirecionando...', 'success');
                            setTimeout(()=> globalThis.location.replace(resolve('agenda.html')), 600);
                        }catch(err){ console.error(err); showFeedback(err.message || 'Falha ao autenticar', 'error'); }
                        finally{ btn.disabled = false; btn.textContent = original; }
                    });
                });
            </script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Dashboard — Prestador</title>
	<link rel="stylesheet" href="../styles/style.css">
	</head>
	<body class="bg-gray-50 font-sans min-h-screen text-gray-800">
		<header data-component="header"></header>

		<div data-component="dashboard"></div>

		<footer data-component="footer"></footer>

	<script type="module">
		import { loadComponents } from '../js/components-loader.js';
		import { requireRole } from '../js/utils/auth.js';
		import { initProviderDashboard } from '../js/pages/dashboardPrestador.js';
		document.addEventListener('DOMContentLoaded', async () => {
			if(!requireRole('PRESTADOR')) return;
			await loadComponents();
			initProviderDashboard();
		});
	</script>
	</body>
</html>

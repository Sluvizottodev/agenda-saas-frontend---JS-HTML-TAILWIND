<!doctype html>
<html lang="pt-br">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Agenda - Listagem</title>
		<link rel="stylesheet" href="../styles/style.css">
</head>
<body class="bg-gray-50 font-sans min-h-screen text-gray-800">
	<header data-component="header"></header>

	<main class="max-w-4xl mx-auto">
		<div class="grid grid-cols-12 gap-6">
			<aside class="col-span-12 md:col-span-3">
				<div class="bg-white rounded shadow p-4 mb-4">
					<h3 class="text-lg font-semibold mb-2">Prestadores</h3>
					<div id="providers-list" class="space-y-2"></div>
				</div>
				<div class="bg-white rounded shadow p-4">
					<h3 class="text-lg font-semibold mb-2">Agendamentos</h3>
					<div id="provider-appointments" class="text-sm text-gray-700"></div>
				</div>
			</aside>

			<section class="col-span-12 md:col-span-9">
				<div id="calendar-root" class="bg-white rounded shadow p-4 mb-4">
					<h2 id="calendar-title" class="text-xl font-bold mb-3">Selecione um prestador</h2>
					<div id="calendar" class="grid grid-cols-7 gap-2 text-sm"></div>
				</div>

				<div data-component="entityForm"></div>
				<div data-component="entityList" class="mt-4"></div>
			</section>
		</div>
	</main>

	<footer data-component="footer"></footer>

		
		<script type="module">
	import { loadComponents } from '../js/components-loader.js';
	import initAgenda from '../js/pages/agenda.js';
	import { renderList, renderForm } from '../js/utils/fetchers.js';

	const ENTITY = 'appointments';

	document.addEventListener('DOMContentLoaded', async () => {
		await loadComponents();
		// initialize our enhanced agenda UI
		initAgenda().catch(() => {});

		const listRoot = document.querySelector('[data-component="entityList"]').querySelector('[data-list-root]');
		const formRoot = document.querySelector('[data-component="entityForm"]').querySelector('[data-form-root]');

		renderForm(formRoot, ENTITY, [
			{ name: 'title', label: 'Título' },
			{ name: 'client', label: 'Cliente' },
			{ name: 'date', label: 'Data/Hora', type: 'datetime-local' }
		], { onSaved: () => renderList(listRoot, ENTITY, ['id','title','client','date']) });

		renderList(listRoot, ENTITY, ['id','title','client','date'], { onDeleted: () => renderList(listRoot, ENTITY, ['id','title','client','date']) });
	});
	</script>

</body>
</html>
